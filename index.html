<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#DCEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111933" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Power-Up Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Sniglet:wght@400;800&display=swap">
<style>
/* Layout: one-screen app in a single centred column (max 640px); play screens pin controls to the bottom for thumbs.
   Look: paper stickers, thick ink outlines, hard drop shadows. Day colours in light mode, night colours in dark mode. */
:root{
  --sky:#DCEFEA; --speck:#C3E2DB; --card:#FFFFFF; --card-2:#EEF7F4;
  --ink:#1D2540; --ink-soft:#56607E; --line:#1D2540; --line-soft:#A8C6C0;
  --marigold:#FF8A3D; --star:#FFC233; --leaf:#22A06B; --leaf-soft:#CDEFDD;
  --rose:#E8577A; --berry:#7357DB; --sea:#2F95D6; --mint:#4FCBA9; --plum:#B04F9C;
  --on-warm:#1D2540; --on-leaf:#FFFFFF; --soft-note:#FFF0DC; --wrong-soft:#FBE1E7;
  --sky-2:#BFE6F7; --grass:#6CBF5C; --grass-2:#5AAE4B; --dirt:#C9A47A; --dirt-deep:#9C7650; --concrete:#B9BFC7;
  --glass:#BFE7F5; --metal:#4A4F5C; --ball:#FFFFFF; --post:#FFFFFF; --roof:#C0563F; --eye:#FFFFFF;
  --skin1:#F6D2B4; --skin2:#D9A27B; --skin3:#8D5A3B; --hair1:#2A2440; --hair2:#E86AA6; --hair3:#2B8C9A;
  --gold:#F5B82E; --silver:#C7CED8; --bronze:#CD8B52; --shadow-mon:#3B2C5E;
  --display:"Sniglet", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:22px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --sky:#111933; --speck:#1C2648; --card:#1E2A4E; --card-2:#263361;
    --ink:#F0F2FF; --ink-soft:#A8B1D8; --line:#060A18; --line-soft:#34416C;
    --marigold:#FF9A55; --star:#FFD154; --leaf:#34C185; --leaf-soft:#173F33;
    --rose:#FF6F90; --berry:#9A82FF; --sea:#4DB0F0; --mint:#62DDBC; --plum:#D47BC4;
    --on-warm:#1D2540; --on-leaf:#05200F; --soft-note:#3A2F27; --wrong-soft:#4A2233;
    --sky-2:#22305A; --grass:#2F6B3A; --grass-2:#285D32; --dirt:#6B4F36; --dirt-deep:#4A3524; --concrete:#7A8292;
    --glass:#5D8FB0; --metal:#2A2F3B; --ball:#EEF1F8; --post:#E8ECF5; --roof:#A84A38; --eye:#FFFFFF;
    --hair2:#F07DB4; --hair3:#3AA7B6; --shadow-mon:#1A1230;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background-color:var(--sky);
  background-image:radial-gradient(var(--speck) 1.6px, transparent 1.8px); background-size:28px 28px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45;
  padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent; overflow-x:hidden; -webkit-text-size-adjust:100%;
}
[hidden]{display:none !important}
#app{max-width:640px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; gap:22px; padding-block:14px 32px}
html.playing body{overflow:hidden}
html.playing #app{height:100%; min-height:0; padding-block:8px 12px; gap:0}
button{font:inherit; color:inherit}
h1,h2,h3{font-family:var(--display); font-weight:800; margin:0; line-height:1.1; text-wrap:balance}
h1{font-size:clamp(32px, 9vw, 48px)}
.block h2{font-size:22px; margin-bottom:12px}
.sub{margin:6px 0 0; color:var(--ink-soft); max-width:36ch}
:focus-visible{outline:4px solid var(--sea); outline-offset:3px}
svg{display:block}
.ic{width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; flex:none; display:inline-block}
.ic.fill{fill:var(--star); stroke:var(--line); stroke-width:1.6}
.art g{stroke:var(--line)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--display); font-weight:800; font-size:22px; padding:13px 22px; border:3px solid var(--line); border-radius:18px; background:var(--card); color:var(--ink); box-shadow:0 5px 0 var(--line); cursor:pointer; touch-action:manipulation; transition:transform .08s, box-shadow .08s; text-align:center}
.btn:active:not(:disabled){transform:translateY(4px); box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--marigold); color:var(--on-warm)}
.btn.go{background:var(--leaf); color:var(--on-leaf)}
.btn.wide{width:100%}
.btn.big{font-size:clamp(21px, 6vw, 28px); padding:15px 18px; border-radius:22px}
.btn.ghost{background:transparent; box-shadow:none; border-style:dashed; font-size:18px; color:var(--ink-soft)}
.btn.small{font-size:17px; padding:7px 14px; box-shadow:0 3px 0 var(--line); border-radius:14px}
.btn.small .ic{width:20px; height:20px}
.btn:disabled{opacity:.45; cursor:default}
.icon-btn{width:52px; height:52px; flex:none; display:grid; place-items:center; border-radius:16px; border:3px solid var(--line); background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--line); cursor:pointer; touch-action:manipulation}
.icon-btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}

.top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.title{font-size:26px; overflow-wrap:anywhere}
.hero-strip{display:flex; align-items:flex-end; gap:6px; margin-top:12px}
.hero-strip > *{flex:1; max-width:120px}

/* players */
.players{display:grid; grid-template-columns:repeat(auto-fill, minmax(146px, 1fr)); gap:14px}
.player{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:164px; padding:14px 10px; border:3px solid var(--line); border-radius:var(--r); background:var(--card); box-shadow:0 5px 0 var(--line); cursor:pointer; text-align:center; touch-action:manipulation}
.player:active{transform:translateY(4px); box-shadow:0 1px 0 var(--line)}
.player.add{border-style:dashed; box-shadow:none; background:transparent; color:var(--ink-soft); font-family:var(--display); font-weight:800; font-size:20px}
.player.add .ic{width:42px; height:42px}
.avatar{display:inline-block; flex:none}
.avatar svg{width:100%; height:100%}
.av{width:78px; height:70px}
.av-sm{width:54px; height:50px}
.av-big{width:120px; height:108px}
.pname{font-family:var(--display); font-weight:800; font-size:22px; line-height:1.1; overflow-wrap:anywhere}
.pmeta{display:inline-flex; align-items:center; gap:4px; color:var(--ink-soft); font-size:14px; font-variant-numeric:tabular-nums}
.pmeta .ic{width:16px; height:16px}
.empty-note{margin:14px 0 0; color:var(--ink-soft); max-width:46ch}

/* family save */
.sync{margin-top:16px; display:flex; flex-direction:column; gap:10px; align-items:flex-start}
.sync-b{display:inline-flex; align-items:center; gap:8px; padding:6px 13px; border-radius:999px; border:2px solid var(--line-soft); background:var(--card); color:var(--ink-soft); font-size:14px; cursor:pointer; text-align:left}
.sync-b .dot{width:10px; height:10px; border-radius:50%; background:var(--ink-soft); flex:none}
.sync-b[data-s="synced"] .dot{background:var(--leaf)}
.sync-b[data-s="syncing"] .dot{background:var(--star)}
.sync-b[data-s="offline"] .dot, .sync-b[data-s="badcode"] .dot{background:var(--rose)}
.sync-panel{display:flex; flex-direction:column; gap:10px; padding:14px; border-radius:18px; background:var(--card-2); width:100%}
.sync-panel p{margin:0; font-size:14px; color:var(--ink-soft); max-width:60ch}
.join-row{display:flex; gap:8px; flex-wrap:wrap}
.join-row .field{flex:1; min-width:160px; text-transform:uppercase; letter-spacing:.08em}
.err{color:var(--rose); font-weight:600}
.code{font-family:var(--display); font-weight:800; letter-spacing:.08em; color:var(--ink)}

/* form */
.form{display:flex; flex-direction:column; gap:10px}
.preview{display:flex; align-items:center; gap:14px; font-family:var(--display); font-weight:800; font-size:30px; min-width:0; overflow-wrap:anywhere}
.lab{font-weight:700; margin-top:8px}
.field{font:600 20px var(--body); padding:11px 14px; border:3px solid var(--line); border-radius:16px; background:var(--card); color:var(--ink); width:100%}
.themes{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px}
.theme-b{display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border:3px solid var(--line-soft); border-radius:18px; background:var(--card); cursor:pointer; font-family:var(--display); font-weight:800; font-size:17px}
.theme-b svg{width:100%; max-width:96px; height:auto; aspect-ratio:10/9}
.theme-b.on{border-color:var(--line); box-shadow:0 4px 0 var(--line); background:var(--leaf-soft)}
.swatches,.ages{display:flex; flex-wrap:wrap; gap:10px}
.sw{width:50px; height:50px; border-radius:50%; background:var(--c); border:3px solid var(--line); cursor:pointer}
.sw.on{box-shadow:0 0 0 4px var(--sky), 0 0 0 7px var(--line)}
.age{min-width:54px; height:54px; padding:0 8px; border-radius:16px; border:3px solid var(--line); background:var(--card); font:800 22px var(--display); cursor:pointer}
.age.on{background:var(--marigold); color:var(--on-warm); box-shadow:0 4px 0 var(--line)}
.hint-text{color:var(--ink-soft); font-size:14px; margin:0}
.form .btn.wide{margin-top:12px}

/* hub */
.who{display:flex; align-items:center; gap:10px; flex:1; min-width:0}
.mission{display:flex; flex-direction:column; gap:12px; padding:14px; border:3px solid var(--line); border-radius:var(--r); background:var(--card); box-shadow:0 5px 0 var(--line)}
.mission-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.mission-head h3{font-size:24px}
.mission-head small{color:var(--ink-soft); font-size:14px}
.scene{border:3px solid var(--line); border-radius:16px; overflow:hidden; background:var(--sky-2)}
.scene svg{width:100%; height:auto}
.stepdots{display:flex; gap:6px}
.stepdots i{flex:1; height:8px; border-radius:4px; background:var(--line-soft)}
.stepdots i.on{background:var(--leaf)}
.stepdots i.now{background:var(--star)}
.power{display:flex; align-items:center; gap:8px}
.power-lab{font-weight:700; font-size:14px; min-width:56px}
.cells{display:flex; gap:5px; flex:1}
.cells i{flex:1; height:22px; border-radius:7px; border:2.5px solid var(--line); background:var(--card-2); position:relative}
.cells i.on{background:var(--pc)}
.cells i.on::after{content:""; position:absolute; inset:3px 30% 50% 12%; border-radius:4px; background:rgba(255,255,255,.45)}
.cells.pop i.on:last-child{animation:pulse .5s ease}
.vs{display:flex; align-items:center; justify-content:space-around; gap:10px; padding:12px; border-radius:16px; background:var(--card-2); text-align:center}
.vs .team{display:flex; flex-direction:column; align-items:center; gap:4px; font-weight:700; font-size:14px}
.vs .team svg{width:64px; height:64px}
.vs .vtxt{font:800 28px var(--display); color:var(--ink-soft)}
.trail{display:flex; align-items:center; gap:0; padding:10px 4px}
.trail .stop{flex:none; width:44px; height:44px; border-radius:50%; border:3px solid var(--line); background:var(--card-2); display:grid; place-items:center; font:800 16px var(--display)}
.trail .stop.on{background:var(--leaf); color:var(--on-leaf)}
.trail .stop.now{background:var(--star); color:var(--on-warm)}
.trail .path{flex:1; height:5px; background:repeating-linear-gradient(90deg, var(--line-soft) 0 8px, transparent 8px 14px)}
.worldrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.worldrow .wtext{flex:1; min-width:150px}
.worlds{display:flex; flex-direction:column; gap:14px; margin-top:14px}
.world{position:relative; display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:12px 14px; border:3px solid var(--line); border-radius:var(--r); background:var(--card); box-shadow:0 5px 0 var(--line); cursor:pointer; touch-action:manipulation}
.world.on{background:var(--leaf-soft)}
.world:active{transform:translateY(4px); box-shadow:0 1px 0 var(--line)}
.wtext{min-width:0; flex:1}
.wtext b{display:block; font-family:var(--display); font-size:20px; line-height:1.15}
.wtext small{display:block; color:var(--ink-soft); font-size:13.5px; margin-top:2px}
.steps{display:flex; gap:4px; flex:none}
.steps i{width:11px; height:11px; border-radius:50%; border:2px solid var(--line); display:block}
.steps i.on{background:var(--wc)}
.badge{flex:none; min-width:66px; height:52px; padding:0 8px; border-radius:14px; display:grid; place-items:center; background:var(--wc); border:3px solid var(--line); font-family:var(--display); font-weight:800; font-size:19px; color:#FFFFFF; white-space:nowrap;
  text-shadow:2px 0 0 var(--line),-2px 0 0 var(--line),0 2px 0 var(--line),0 -2px 0 var(--line),2px 2px 0 var(--line),-2px -2px 0 var(--line),2px -2px 0 var(--line),-2px 2px 0 var(--line)}
.ribbon{position:absolute; top:-12px; left:14px; background:var(--star); color:var(--on-warm); border:2px solid var(--line); border-radius:999px; font:700 11.5px var(--body); letter-spacing:.07em; text-transform:uppercase; padding:2px 10px}
.shelf{display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:10px; padding:12px; border:3px solid var(--line); border-radius:18px; background:var(--card-2)}
.shelf.empty{display:block; color:var(--ink-soft)}
.shelf-item{display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; font-size:12.5px; color:var(--ink-soft); min-width:0}
.shelf-item svg{width:76px; height:70px}
.record{margin:10px 0 0; color:var(--ink-soft); font-size:14px}
.set-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:10px 0; border-bottom:2px dashed var(--line-soft)}
.set-row > span{font-weight:600}
.seg{display:inline-flex; border:3px solid var(--line); border-radius:14px; overflow:hidden}
.seg-b{padding:8px 14px; background:var(--card); border:0; cursor:pointer; font-weight:600; font-size:15px}
.seg-b + .seg-b{border-left:3px solid var(--line)}
.seg-b.on{background:var(--marigold); color:var(--on-warm)}

/* play (charge + action) */
.play{display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100%; gap:10px}
.bar{display:flex; align-items:center; gap:8px}
.bar .power{flex:1; min-width:0}
.bar .power-lab{min-width:0}
.stage{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; min-height:0; overflow-y:auto; padding:4px 0}
.wtag{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--ink-soft); text-align:center}
.wtag::before{content:""; width:10px; height:10px; border-radius:50%; background:var(--wc); border:2px solid var(--line); flex:none}
.qlabel{font-family:var(--display); font-weight:800; font-size:24px}
.q{display:flex; justify-content:center; width:100%}
.expr{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.18em .28em; font-family:var(--display); font-weight:800; font-size:clamp(42px, 12.5vw, 80px); line-height:1; font-variant-numeric:tabular-nums}
.tok{white-space:nowrap}
.tok.op{color:var(--ink-soft)}
.tok.word{font-size:.5em; color:var(--ink-soft)}
.frac{display:inline-flex; flex-direction:column; align-items:center; font-size:.62em; line-height:.95}
.frac sup,.frac sub{font-size:1em; vertical-align:baseline; padding:0 .12em}
.frac sup{border-bottom:.09em solid currentColor}
.slot{min-width:1.35em; padding:.06em .16em; border:4px dashed var(--ink-soft); border-radius:.22em; text-align:center; color:var(--ink-soft)}
.slot.good{border-style:solid; border-color:var(--line); background:var(--leaf); color:var(--on-leaf)}
.slot.reveal{border-style:solid; border-color:var(--leaf); color:var(--leaf)}
.tile{padding:.06em .18em; border:3px solid var(--line); border-radius:.2em; background:var(--card)}
.bignum{font:800 clamp(96px, 30vw, 156px)/1 var(--display)}
.objs{display:grid; grid-template-columns:repeat(var(--cols), auto); gap:clamp(6px, 2vw, 12px); justify-content:center}
.obj{position:relative; width:clamp(44px, 13vw, 70px); aspect-ratio:1}
.objs.few .obj{width:clamp(60px, 19vw, 104px)}
.objs.many .obj{width:clamp(30px, 9vw, 46px)}
.obj svg{width:100%; height:100%}
.objs.enter .obj{animation:pop .36s cubic-bezier(.3,1.6,.6,1) both; animation-delay:calc(var(--i) * 45ms)}
.obj .num{position:absolute; right:-6px; bottom:-6px; min-width:22px; height:22px; padding:0 4px; border-radius:11px; background:var(--card); border:2px solid var(--line); font:700 12px/18px var(--body); text-align:center}
.aid{padding:10px 14px; border-radius:18px; background:var(--card-2); max-width:100%}
.aid-row{display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap}
.aop{font:800 30px var(--display); color:var(--ink-soft)}
.aid-cap{font-size:13px; color:var(--ink-soft); text-align:center; margin-top:6px}
.dots{display:grid; grid-template-columns:repeat(5, auto); gap:5px; justify-content:center}
.dots i{display:block; width:18px; height:18px; border-radius:50%; background:var(--c); border:2px solid var(--line)}
.dots i.x{position:relative; background:transparent; border-style:dashed; border-color:var(--ink-soft)}
.dots i.x::after{content:""; position:absolute; inset:-4px; background:linear-gradient(45deg, transparent 44%, var(--rose) 44% 58%, transparent 58%)}
.dots.zero{display:grid; place-items:center; min-width:30px; min-height:30px; border:2px dashed var(--ink-soft); border-radius:8px}
.dots.mini{gap:2px; margin-top:5px}
.dots.mini i{width:8px; height:8px; border:0; background:var(--ink-soft)}
.choice.good .dots.mini i{background:var(--on-leaf)}
.gdots i{width:clamp(14px, 4vw, 20px); height:clamp(14px, 4vw, 20px)}
.blocks{display:flex; align-items:flex-end; gap:6px}
.rods{display:flex; gap:3px}
.rod{display:block; width:11px; height:72px; border:2px solid var(--line); border-radius:3px; background:repeating-linear-gradient(to bottom, var(--sea) 0 5px, var(--line) 5px 6.8px)}
.ones{display:grid; grid-template-columns:repeat(3, 11px); gap:3px}
.ones i{display:block; width:11px; height:11px; border:2px solid var(--line); border-radius:2px; background:var(--marigold)}
.arr{display:grid; grid-template-columns:repeat(var(--cols), auto); gap:4px; justify-content:center}
.arr i{display:block; width:clamp(8px, 2.6vw, 14px); aspect-ratio:1; border-radius:50%; background:var(--berry)}
.bowls{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.bowl{padding:6px; border:2.5px solid var(--line); border-radius:12px 12px 22px 22px; background:var(--card)}
.bowl.hi{background:var(--leaf-soft)}
.bowl .dots{grid-template-columns:repeat(4, auto); gap:3px}
.bowl .dots i{width:10px; height:10px; border-width:1.5px}
.fb{display:flex; align-items:center; gap:10px; width:100%; max-width:520px; padding:8px 8px 8px 14px; border:3px solid var(--line); border-radius:20px; background:var(--card)}
.fb.good{background:var(--leaf-soft)}
.fb.soft{background:var(--soft-note)}
.fb-msg{flex:1; min-width:0; font-family:var(--display); font-weight:800; font-size:22px; line-height:1.15}
.fb-msg b{font-size:1.2em}
.next{padding:10px 16px}
.next .ic{width:30px; height:30px}
.choices{display:grid; grid-template-columns:repeat(2, 1fr); gap:12px}
.choices.c3{grid-template-columns:repeat(3, 1fr)}
.choice{min-height:clamp(76px, 13vh, 116px); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; border:3px solid var(--line); border-radius:22px; background:var(--card); color:var(--ink); box-shadow:0 6px 0 var(--line); cursor:pointer; touch-action:manipulation; transition:transform .08s, box-shadow .08s}
.choice:active:not(:disabled){transform:translateY(5px); box-shadow:0 1px 0 var(--line)}
.choice:disabled{cursor:default}
.cnum{font:800 clamp(36px, 10vw, 56px)/1 var(--display); font-variant-numeric:tabular-nums}
.choice.good{background:var(--leaf); color:var(--on-leaf); animation:pulse .5s ease}
.choice.miss{background:var(--wrong-soft); transform:translateY(4px); box-shadow:0 2px 0 var(--line)}
.choice.dim{opacity:.45}
.groups .choice{min-height:clamp(96px, 16vh, 140px)}
.pad{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px}
.key{min-height:clamp(50px, 8.4vh, 70px); display:grid; place-items:center; border:3px solid var(--line); border-radius:16px; background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--line); font:800 30px var(--display); cursor:pointer; touch-action:manipulation}
.key:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.key.ok{background:var(--leaf); color:var(--on-leaf)}
.key.del{background:var(--card-2)}
.key:disabled{opacity:.4; cursor:default}

/* action scenes */
.act-title{font-size:clamp(24px, 7vw, 32px); text-align:center}
.act-sub{margin:0; color:var(--ink-soft); text-align:center; font-weight:600}
.act-scene{width:100%; max-width:520px}
.work .truck-wrap{animation:rumble .25s ease}
.pitch{position:relative; width:100%; max-width:520px; aspect-ratio:16/11; border:3px solid var(--line); border-radius:16px; overflow:hidden; background:var(--grass)}
.pitch > svg{position:absolute; inset:0; width:100%; height:100%}
.zone{position:absolute; width:24%; height:28%; transform:translate(-50%,-50%); border:3px dashed rgba(255,255,255,.75); border-radius:14px; background:rgba(255,255,255,.12); cursor:pointer; display:grid; place-items:center; touch-action:manipulation}
.zone::after{content:""; width:26px; height:26px; border-radius:50%; border:4px solid rgba(255,255,255,.85)}
.zone:active{background:rgba(255,255,255,.3)}
.zone:disabled{opacity:0; cursor:default}
.keeper,.kball{position:absolute; transform:translate(-50%,-50%); transition:left .38s cubic-bezier(.2,.8,.3,1), top .38s cubic-bezier(.2,.8,.3,1), transform .38s ease; pointer-events:none}
.keeper{width:22%; left:50%; top:52%}
.kball{width:10%; left:50%; top:90%}
.keeper svg,.kball svg{width:100%; height:auto}
.kick-msg{position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); font:800 clamp(34px, 11vw, 56px) var(--display); color:#FFFFFF; white-space:nowrap; pointer-events:none;
  text-shadow:3px 0 0 var(--line),-3px 0 0 var(--line),0 3px 0 var(--line),0 -3px 0 var(--line),3px 3px 0 var(--line),-3px -3px 0 var(--line),3px -3px 0 var(--line),-3px 3px 0 var(--line); animation:pop .35s cubic-bezier(.3,1.6,.6,1) both}
.scoreline{display:flex; gap:6px; justify-content:center}
.scoreline i{width:22px; height:22px; border-radius:50%; border:2.5px solid var(--line); background:var(--card-2)}
.scoreline i.g{background:var(--leaf)}
.scoreline i.s{background:var(--rose)}
.arena{position:relative; width:100%; max-width:520px; aspect-ratio:16/10; border:3px solid var(--line); border-radius:16px; overflow:hidden; background:linear-gradient(var(--sky-2), var(--card-2))}
.arena .fighter{position:absolute; bottom:6%; width:38%}
.arena .fighter svg{width:100%; height:auto}
.arena .me{left:4%}
.arena .mon{right:4%; width:40%}
.arena .hp{position:absolute; top:6%; right:6%; display:flex; gap:4px}
.arena .hp i{width:20px; height:18px; display:block; background:var(--rose); clip-path:path("M10 17 C3 12 0 9 0 5.5 0 2.5 2.4 0 5.2 0 7.2 0 8.8 1.2 10 3 11.2 1.2 12.8 0 14.8 0 17.6 0 20 2.5 20 5.5 20 9 17 12 10 17Z")}
.arena .hp i.off{background:var(--line-soft)}
.arena .lvl{position:absolute; top:6%; left:6%; padding:2px 10px; border-radius:999px; border:2px solid var(--line); background:var(--star); color:var(--on-warm); font:800 14px var(--display)}
.beam{position:absolute; left:34%; top:50%; height:16%; width:0; border-radius:999px; background:linear-gradient(90deg, var(--star), #FFFFFF); box-shadow:0 0 18px var(--star); opacity:0}
.blast .beam{animation:beam .45s ease-out}
.blast .mon svg{animation:hit .45s ease}
.mon.gone svg{animation:poof .6s ease forwards}
.aura{animation:aura 1.8s ease-in-out infinite}
.done-panel{display:flex; flex-direction:column; gap:12px; align-items:stretch; width:100%}
.done-panel .act-title{margin-bottom:2px}

/* reward */
.results{display:flex; flex-direction:column; align-items:center; gap:14px; padding-top:10px; text-align:center}
.rtitle{font-size:clamp(32px, 9vw, 46px)}
.reward-art{width:min(280px, 74vw)}
.reward-art svg{width:100%; height:auto}
.rmsg{margin:0; font-size:18px; max-width:32ch}
.ractions{display:flex; flex-direction:column; gap:14px; width:100%; max-width:360px; margin-top:6px}

#fx{position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden}
.spark{position:absolute; width:24px; height:24px; margin:-12px 0 0 -12px; animation:spark .85s ease-out forwards}
.spark .ic{width:100%; height:100%; fill:var(--c)}
#toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 72px); transform:translateX(-50%); z-index:60; display:flex; align-items:center; gap:6px; padding:8px 18px; border:3px solid var(--line); border-radius:999px; background:var(--star); color:var(--on-warm); box-shadow:0 4px 0 var(--line); font:800 20px var(--display); white-space:nowrap}

@keyframes pop{from{transform:scale(.2); opacity:0} to{transform:none; opacity:1}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes pulse{40%{transform:scale(1.08)}}
@keyframes rumble{25%{transform:translate(-3px,1px) rotate(-1deg)} 50%{transform:translate(3px,-1px)} 75%{transform:translate(-2px,0) rotate(1deg)}}
@keyframes spark{to{transform:translate(var(--dx), var(--dy)) rotate(160deg) scale(.4); opacity:0}}
@keyframes beam{0%{width:0; opacity:1} 70%{width:34%; opacity:1} 100%{width:34%; opacity:0}}
@keyframes hit{30%{transform:translateX(10px) rotate(6deg)} 60%{transform:translateX(-6px)}}
@keyframes poof{to{transform:scale(.2) rotate(40deg); opacity:0}}
@keyframes aura{50%{opacity:.85; transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none !important; transition:none !important} }
@media (max-width:380px){ .badge{min-width:56px; height:46px; font-size:16px} .world{gap:10px; padding:12px 10px} .icon-btn{width:46px; height:46px} }
</style>

      <div class="kball" id="kball" ${a.shot ? `style="left:${ZONES[a.shot.z][0]}%;top:${ZONES[a.shot.z][1]}%;transform:translate(-50%,-50%) scale(.6)"` : ''}>${shapeSVG('ball', 'ball')}</div>
      ${a.done ? '' : [0,1,2,3,4,5].map(z => { const [x, y] = ZONES[z]; return `<button class="zone" data-act="kick" data-z="${z}" style="left:${x}%;top:${y}%" aria-label="Shoot ${['top left','top middle','top right','bottom left','bottom middle','bottom right'][z]}" ${a.busy ? 'disabled' : ''}></button>`; }).join('')}
      ${a.msg ? `<div class="kick-msg">${a.msg}</div>` : ''}
    </div><div class="scoreline" aria-label="${q.goals} goals">${Array.from({length:FULL}, (_, i) => `<i class="${kicks[i] === 1 ? 'g' : kicks[i] === 0 ? 's' : ''}"></i>`).join('')}</div>`;
  } else {
    const mon = a.done ? a.done.mon : m.mon, ch = a.done ? a.done.ch : m.ch;
    title = a.done ? a.done.title : `Stop the ${mon}!`;
    sub = a.done ? a.done.sub : `Tap Power blast to use your power. ${FULL - q.prog} left.`;
    const hp = a.done ? 0 : FULL - q.prog;
    const auraC = ['star', 'sea', 'berry', 'rose', 'mint'][q.level % 5];
    scene = `<div class="arena ${a.anim ? 'blast' : ''}" id="arena"><span class="lvl">Level ${q.level + 1}</span>
      <div class="fighter me">${heroSVG(p.hero, p.color, auraC)}</div>
      <div class="fighter mon ${a.done ? 'gone' : ''}">${monsterSVG(ch.color)}</div>
      <div class="hp" aria-label="${hp} hearts left">${Array.from({length:FULL}, (_, i) => `<i class="${i < hp ? '' : 'off'}"></i>`).join('')}</div>
      <div class="beam"></div></div>`;
    if (!a.done) controls = `<button class="btn go big wide" data-act="blast">${icon('bolt')} Power blast!</button>`;
  }
  return `<div class="play">
    <header class="bar"><button class="icon-btn" data-act="back" data-to="hub" aria-label="Back to base">${icon('x')}</button>${powerBar(p)}${muteBtn()}</header>
    <div class="stage"><h2 class="act-title">${esc(title)}</h2>${scene}<p class="act-sub">${esc(sub)}</p></div>
    <div class="answers">${controls}</div>
  </div>`;
}
const ZONES = [[25, 28], [50, 28], [75, 28], [25, 57], [50, 57], [75, 57]];
function renderReward(){
  const p = P(), r = act.reward;
  let art = '';
  if (p.theme === 'trucks') art = buildingSVG(PROJECTS[r.i % PROJECTS.length].color);
  else if (p.theme === 'soccer') art = trophySVG(r.m);
  else art = badgeSVG(CHAPTERS[r.i % CHAPTERS.length].color, r.i + 1);
  return `<div class="results">
    <h2 class="rtitle">${esc(r.title)}</h2>
    <div class="reward-art">${art}</div>
    <p class="rmsg">${esc(r.msg)}</p>
    <div class="ractions"><button class="btn primary big" data-act="charge">${icon('bolt')} ${esc(r.next)}</button><button class="btn" data-act="back" data-to="hub">Back to base</button></div>
  </div>`;
}
function render(){
  if (view !== 'home' && view !== 'form' && !P()) view = 'home';
  if (view === 'charge' && !round) view = 'hub';
  if ((view === 'action' || view === 'reward') && !act) view = 'hub';
  if (view === 'reward' && !act.reward) view = 'hub';
  if (view === 'form' && !draft) view = 'home';
  document.documentElement.classList.toggle('playing', view === 'charge' || view === 'action');
  app.innerHTML = view === 'form' ? renderForm() : view === 'hub' ? renderHub() : view === 'charge' ? renderCharge() : view === 'action' ? renderAction() : view === 'reward' ? renderReward() : renderHome();
  if (round) round.fresh = false;
}
function refresh(){ if (view === 'home' || view === 'hub') render(); }
function go(v){ view = v; render(); try { W.scrollTo(0, 0); } catch (e) {} }

/* ---------- charging (math) ---------- */
function startCharge(){
  const p = P(); if (!p) return go('home');
  clearTimeout(nextTimer);
  if (canAct(p)) return startAction();
  round = {level:p.world, lastKey:''};
  nextQ(); go('charge'); sayIf(round.q.spoken);
}
function nextQ(){
  const p = P(), L = lv(p, round.level);
  let q, g = 0;
  do { q = gen(round.level, L.tier, p.theme); } while (q.key === round.lastKey && g++ < 8);
  Object.assign(round, {q, lastKey:q.key, tier:L.tier, answered:false, picked:null, correct:null, typed:'', hint:false, msg:'', fresh:true});
}
function answer(v){
  if (!round || round.answered) return;
  const p = P(); if (!p) return;
  const q = round.q, ok = v === q.ans, L = lv(p, round.level);
  let up = false;
  Object.assign(round, {answered:true, picked:v, correct:ok, msg:ok ? pick(PRAISE) : ''});
  if (ok) {
    p.stars++; L.stars++; L.misses = 0;
    if (!round.hint) L.streak++;
    if (L.streak >= 3 && L.tier < maxTier(round.level)) { L.tier++; L.streak = 0; up = true; }
    p.quest.power = Math.min(FULL - p.quest.prog, p.quest.power + 1);
  } else {
    L.streak = 0; L.misses++;
    if (L.misses >= 2 && L.tier > 0) { L.tier--; L.misses = 0; }
  }
  savePlayer(p);
  const full = canAct(p);
  sfx(ok ? (full ? 'full' : 'yes') : 'no');
  render();
  if (ok) {
    burst(app.querySelector('.choice.good') || app.querySelector('.slot'));
    if (up) toast(`${icon('up')} Math step up!`);
    sayIf(full ? 'Full power! Go!' : round.msg);
    if (!full) nextTimer = setTimeout(advance, up ? 1500 : 1100);
  } else sayIf(`Nice try. It's ${q.ans}.`);
}
function advance(){
  clearTimeout(nextTimer);
  if (!round || !round.answered || view !== 'charge') return;
  if (canAct(P())) return startAction();
  nextQ(); render(); sayIf(round.q.spoken);
}

/* ---------- actions (mini-games) ---------- */
function startAction(){
  const p = P(); if (!p) return go('home');
  clearTimeout(nextTimer); round = null;
  if (!canAct(p)) return startCharge();
  act = {busy:false, kicks:[], msg:'', anim:false, done:null, reward:null};
  go('action');
  const m = missionInfo(p);
  sayIf(p.theme === 'trucks' ? `${JOBS[p.quest.step].title}. Tap ${JOBS[p.quest.step].verb}` : p.theme === 'soccer' ? 'Tap a spot in the goal to shoot.' : `Stop the ${m.mon}! Tap power blast.`);
}
function finishStep(p, done){
  const q = p.quest;
  q.prog = 0; q.power = 0; q.goals = 0;
  q.step++;
  if (q.step >= 4) {
    const i = q.mission, rec = {i};
    if (p.theme === 'soccer') rec.m = q.wins >= 3 ? 'gold' : q.wins >= 1 ? 'silver' : 'bronze';
    q.done.push(rec);
    q.mission++; q.step = 0; q.wins = 0;
    if (p.theme === 'trucks') act.reward = {...rec, title:`${PROJECTS[i % PROJECTS.length].name} built!`, msg:`It's now part of ${p.name}'s town. Time for the next project.`, next:'Start the next project'};
    else if (p.theme === 'soccer') act.reward = {...rec, title:`${CUPS[i % CUPS.length]}: ${rec.m}!`, msg:`${p.name}'s team finished the cup. A new cup starts now.`, next:'Start the next cup'};
    else act.reward = {...rec, title:`${CHAPTERS[i % CHAPTERS.length].name} cleared!`, msg:`${HEROES[p.hero].name} earned a badge and is now level ${q.level + 1}.`, next:'Go to the next world'};
  }
  act.done = done;
  savePlayer(p);
}
function work(){
  const p = P(); if (!p || !act || act.busy || act.done) return;
  const q = p.quest; if (q.power <= 0) return startCharge();
  act.busy = true; act.anim = true;
  q.power--; q.prog++;
  sfx('engine');
  if (q.prog >= FULL) {
    const step = q.step, mission = q.mission, job = JOBS[step];
    finishStep(p, {title:job.done, sub:step === 3 ? 'The building is finished!' : 'Charge up to start the next job.', step:step === 3 ? 4 : step, mission});
    render(); burst(app.querySelector('.scene')); sfx('fanfare'); sayIf(job.done);
    setTimeout(() => { act && (act.anim = false); }, 300);
    if (act.reward) setTimeout(() => { if (view === 'action' && act && act.reward) go('reward'); }, 1800);
    act.busy = false; return;
  }
  savePlayer(p); render();
  setTimeout(() => { if (act) { act.busy = false; act.anim = false; } }, 220);
}
function kick(z){
  const p = P(); if (!p || !act || act.busy || act.done) return;
  const q = p.quest; if (q.power <= 0) return startCharge();
  act.busy = true; act.msg = '';
  const saved = Math.random() < (p.age <= 5 ? .18 : p.age <= 8 ? .25 : .3);
  const kz = saved ? z : pick([0,1,2,3,4,5].filter(x => x !== z && (Math.random() < .6 ? Math.abs(x % 3 - z % 3) <= 1 : true)));
  render();
  sfx('kick');
  const ball = document.getElementById('kball'), keeper = document.getElementById('keeper');
  requestAnimationFrame(() => {
    if (act) act.shot = {z, kz};
    if (ball) { ball.style.left = ZONES[z][0] + '%'; ball.style.top = ZONES[z][1] + '%'; ball.style.transform = 'translate(-50%,-50%) scale(.6)'; }
    if (keeper) { keeper.style.left = ZONES[kz][0] + '%'; keeper.style.top = (ZONES[kz][1] + 6) + '%'; keeper.style.transform = `translate(-50%,-50%) rotate(${(kz % 3 - 1) * 35}deg)`; }
  });
  setTimeout(() => {
    if (!act) return;
    q.power--; q.prog++;
    act.kicks.push(saved ? 0 : 1);
    if (!saved) q.goals++;
    act.msg = saved ? 'Saved!' : 'GOAL!';
    sfx(saved ? 'save' : 'goal');
    if (q.prog >= FULL) {
      const team = TEAMS[(q.mission * 4 + q.step) % TEAMS.length];
      const og = rnd(0, p.age <= 5 ? 2 : 3), g = q.goals;
      const res = g > og ? 'w' : g === og ? 'd' : 'l';
      q.record[res]++; if (res === 'w') q.wins++;
      const title = res === 'w' ? `You won ${g}–${og}!` : res === 'd' ? `A draw, ${g}–${og}` : `Close one, ${g}–${og}`;
      finishStep(p, {title, sub:`${team.name} scored ${og}. ${res === 'l' ? 'Next match is a new chance!' : 'Charge up for the next match.'}`, team});
      render(); if (res === 'w') { burst(app.querySelector('.pitch')); sfx('fanfare'); }
      sayIf(title);
      if (act.reward) setTimeout(() => { if (view === 'action' && act && act.reward) go('reward'); }, 2000);
    } else {
      savePlayer(p); render();
      if (!saved) burst(app.querySelector('.kick-msg'));
      setTimeout(() => { if (act && !act.done) { act.busy = false; act.msg = ''; act.shot = null; render(); } }, 1000);
    }
  }, 450);
}
function blast(){
  const p = P(); if (!p || !act || act.busy || act.done) return;
  const q = p.quest; if (q.power <= 0) return startCharge();
  act.busy = true;
  q.power--; q.prog++;
  sfx('blast');
  act.anim = false; render(); void app.offsetWidth; act.anim = true;
  const arena = document.getElementById('arena'); if (arena) arena.classList.add('blast');
  setTimeout(() => {
    if (!act) return;
    act.anim = false;
    if (q.prog >= FULL) {
      const m = missionInfo(p);
      q.level++;
      finishStep(p, {title:`${m.mon} stopped!`, sub:`${HEROES[p.hero].name} is now level ${q.level + 1}. Charge up for the next stop.`, mon:m.mon, ch:m.ch});
      render(); burst(app.querySelector('.arena')); sfx('fanfare'); sayIf(`${m.mon} stopped!`);
      if (act.reward) setTimeout(() => { if (view === 'action' && act && act.reward) go('reward'); }, 2000);
    } else { savePlayer(p); render(); }
    if (act) act.busy = false;
  }, 460);
}
function quitCharge(){ clearTimeout(nextTimer); round = null; try { speechSynthesis.cancel(); } catch (e) {} go('hub'); }

/* ---------- effects ---------- */
function burst(el){
  if (!el || reduced()) return;
  const r = el.getBoundingClientRect(), fx = document.getElementById('fx');
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('span'), a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 80;
    s.className = 'spark'; s.style.left = (r.left + r.width / 2) + 'px'; s.style.top = (r.top + r.height / 2) + 'px';
    s.style.setProperty('--dx', (Math.cos(a) * d).toFixed(0) + 'px'); s.style.setProperty('--dy', (Math.sin(a) * d - 30).toFixed(0) + 'px');
    s.style.setProperty('--c', `var(--${pick(['star', 'marigold', 'mint', 'rose'])})`);
    s.innerHTML = icon('star', 'fill'); fx.appendChild(s); setTimeout(() => s.remove(), 900);
  }
}
let toastTimer = null;
function toast(html){ const t = document.getElementById('toast'); t.innerHTML = html; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1600); }
function updateSlot(){
  const s = app.querySelector('.slot'); if (s) s.textContent = round.typed || '?';
  const ok = app.querySelector('.key.ok'); if (ok) ok.disabled = !round.typed;
}

/* ---------- events ---------- */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  ac();
  const a = el.dataset.act;
  switch (a) {
    case 'add-player': draft = {name:'', color:pick(COLORS), theme:'trucks', hero:0, age:5}; confirmDel = false; sfx('tap'); go('form'); break;
    case 'open': pid = el.dataset.id; showWorlds = false; sfx('tap'); go('hub'); break;
    case 'edit': { const p = P(); if (!p) break; draft = {id:p.id, name:p.name, color:p.color, theme:p.theme, hero:p.hero, age:p.age}; confirmDel = false; sfx('tap'); go('form'); break; }
    case 'pick': { const k = el.dataset.k; draft[k] = (k === 'age' || k === 'hero') ? Number(el.dataset.v) : el.dataset.v; confirmDel = false; sfx('tap'); render(); break; }
    case 'save-player': saveForm(); break;
    case 'del-player': {
      if (!confirmDel) { confirmDel = true; render(); break; }
      const id = draft.id; S.players = S.players.filter(p => p.id !== id); saveLocal(); deleteRemote(id);
      pid = null; draft = null; go('home'); break;
    }
    case 'back': {
      const to = el.dataset.to;
      if (view === 'charge') { quitCharge(); break; }
      act = null; round = null;
      if (to === 'hub' && !P()) go('home'); else { go(to); if (to === 'home') pull(); }
      break;
    }
    case 'charge': act = null; sfx('tap'); startCharge(); break;
    case 'action': sfx('tap'); startAction(); break;
    case 'choose': answer(Number(el.dataset.v)); break;
    case 'key': {
      if (!round || round.answered) break;
      const k = el.dataset.k;
      if (k === 'ok') { if (round.typed) answer(Number(round.typed)); break; }
      if (k === 'del') round.typed = round.typed.slice(0, -1);
      else if (round.typed.length < 4) round.typed = (round.typed === '0' ? '' : round.typed) + k;
      sfx('tap'); updateSlot(); break;
    }
    case 'next': advance(); break;
    case 'hint': round.hint = true; sfx('tap'); render(); break;
    case 'say': if (round && round.q) { if (S.muted) toast('Sound is off'); else say(round.q.spoken); } break;
    case 'quit': quitCharge(); break;
    case 'work': work(); break;
    case 'kick': kick(Number(el.dataset.z)); break;
    case 'blast': blast(); break;
    case 'mute': {
      S.muted = !S.muted; saveLocal();
      if (S.muted) { try { speechSynthesis.cancel(); } catch (e) {} } else sfx('tap');
      const m = document.getElementById('mute'); if (m) m.outerHTML = muteBtn();
      break;
    }
    case 'set': {
      const p = P(); if (!p) break;
      if (el.dataset.k === 'mode') p.mode = el.dataset.v === 'keypad' ? 'keypad' : 'choices';
      if (el.dataset.k === 'speak') { p.speak = el.dataset.v === 'on'; if (p.speak) say(`Hi ${p.name}!`); }
      savePlayer(p); sfx('tap'); render(); break;
    }
    case 'toggle-worlds': showWorlds = !showWorlds; sfx('tap'); render(); break;
    case 'set-world': { const p = P(); if (!p || !LV[el.dataset.level]) break; p.world = el.dataset.level; lv(p, p.world); showWorlds = false; savePlayer(p); sfx('tap'); render(); break; }
    case 'sync-info': showSync = !showSync; sync.joinErr = ''; setSync(sync.state); if (showSync && !family) { const f = document.getElementById('joincode'); if (f) f.focus(); } break;
    case 'join': { const f = document.getElementById('joincode'); joinFamily(f ? f.value : ''); break; }
    case 'copy-link': {
      const link = familyLink(), note = document.getElementById('copy-note');
      const show = msg => { if (note) { note.textContent = msg; note.hidden = false; } };
      const manual = () => show(`Copy this link: ${link}`);
      try { navigator.clipboard.writeText(link).then(() => show('Copied. Send it to anyone in the family.'), manual); } catch (err) { manual(); }
      break;
    }
  }
});
app.addEventListener('input', e => {
  if (e.target.id !== 'pname' || !draft) return;
  draft.name = e.target.value.slice(0, 16);
  const pv = document.getElementById('pv-name'); if (pv) pv.textContent = draft.name || 'Name';
  const sb = document.getElementById('save-btn'); if (sb) sb.disabled = !draft.name.trim();
});
app.addEventListener('keydown', e => {
  if (e.target.id === 'pname' && e.key === 'Enter' && draft && draft.name.trim()) { e.preventDefault(); saveForm(); }
  if (e.target.id === 'joincode' && e.key === 'Enter') { e.preventDefault(); joinFamily(e.target.value); }
});
document.addEventListener('keydown', e => {
  if (view !== 'charge' || !round || (e.target && e.target.tagName === 'INPUT')) return;
  if (round.answered) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); canAct(P()) ? startAction() : advance(); } return; }
  if (!app.querySelector('.slot')) return;
  if (/^[0-9]$/.test(e.key)) { if (round.typed.length < 4) { round.typed = (round.typed === '0' ? '' : round.typed) + e.key; updateSlot(); } }
  else if (e.key === 'Backspace') { round.typed = round.typed.slice(0, -1); updateSlot(); }
  else if (e.key === 'Enter' && round.typed) { e.preventDefault(); answer(Number(round.typed)); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
setInterval(() => { if (document.visibilityState === 'visible' && (view === 'home' || view === 'hub')) pull(); }, 45000);

function saveForm(){
  const d = draft, name = d.name.trim().slice(0, 16);
  if (!name) return;
  const [start, tier] = AGE_START[d.age] || ['count', 0];
  if (d.id) {
    const p = S.players.find(x => x.id === d.id); if (!p) return go('home');
    const ageChanged = p.age !== d.age;
    Object.assign(p, {name, color:d.color, theme:d.theme, hero:d.hero, age:d.age});
    if (ageChanged) { p.start = start; p.world = start; if (!p.levels[start]) lv(p, start).tier = tier; }
    savePlayer(p); pid = p.id;
  } else {
    const p = normalize({id:uid(), name, color:d.color, theme:d.theme, hero:d.hero, age:d.age, start, world:start, speak:d.age <= 6, created:Date.now()});
    lv(p, start).tier = tier;
    S.players.push(p); savePlayer(p); pid = p.id;
  }
  draft = null; sfx('tap'); go('hub');
}

W.__pumTest = {gen, LEVELS, normalize};
render();
pull();
})();
</script>
